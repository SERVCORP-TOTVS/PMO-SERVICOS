// ─── HELPERS ───
function statusPill(s) {
    if (s === 'andamento')  return `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-sky-100 text-sky-600">● Em andamento</span>`;
    if (s === 'encerrado')  return `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-600">● Concluído</span>`;
    return `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-100 text-amber-600">● À iniciar</span>`;
}

function countProjects() {
    let total = 0, andamento = 0, iniciar = 0, encerrado = 0;
    appData.iniciativas.forEach(i => {
        if (i.tipo === 'iniciativa') {
            i.projetos.forEach(p => {
                total++;
                if (p.status === 'andamento') andamento++;
                else if (p.status === 'encerrado') encerrado++;
                else iniciar++;
            });
        }
    });
    return { total, andamento, iniciar, encerrado };
}

function countByResp() {
    const map = {};
    appData.iniciativas.forEach(i => {
        if (i.tipo !== 'iniciativa') return;
        i.projetos.forEach(p => {
            if (p.status === 'encerrado') return;
            p.responsavel.split('·').forEach(r => {
                const name = r.trim();
                if (name === 'A definir') return;
                map[name] = (map[name] || 0) + 1;
            });
        });
    });
    return Object.entries(map).sort((a, b) => b[1] - a[1]);
}

// ─── SIDEBAR ───
function renderSidebar() {
    const nav = document.getElementById('sidebar-nav');
    nav.innerHTML = '';
    appData.iniciativas.forEach(ini => {
        const count = ini.tipo === 'iniciativa' ? ini.projetos.length : null;
        const el = document.createElement('div');
        el.className = 'nav-item px-4 py-2.5 rounded flex items-center gap-3 text-sm font-medium text-slate-600 shrink-0';
        el.innerHTML = `
            <span class="text-base">${ini.icon}</span>
            <span class="flex-1 leading-tight">${ini.shortTitle}</span>
            ${count ? `<span class="text-xs bg-slate-100 text-slate-400 font-semibold px-1.5 py-0.5 rounded-full">${count}</span>` : ''}
        `;
        if (ini.id === 'overview') el.classList.add('active');
        el.addEventListener('click', () => {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            ini.tipo === 'overview' ? renderOverview() : renderIniciativa(ini.id);
        });
        nav.appendChild(el);
    });
}

                        <th class="py-3 px-4 text-left text-xs font-semibold text-slate-400 uppercase tracking-wide hidden md:table-cell">Responsável(eis)</th>
                        <th class="py-3 px-4 text-left text-xs font-semibold text-slate-400 uppercase tracking-wide">Status</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">${tableRows}</tbody>
            </table>
        </div>
    </div>`;

    setTimeout(() => {
        const ctx = document.getElementById('donutChart');
        if (!ctx) return;
        new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ["Em andamento", "À iniciar", "Concluídos"],
                datasets: [{ data: [counts.andamento, counts.iniciar, counts.encerrado], backgroundColor: ['#0ea5e9', '#f59e0b', '#10b981'], borderWidth: 0, hoverOffset: 6 }]
            },
            options: { cutout: '72%', plugins: { legend: { position: 'bottom', labels: { font: { size: 11, family: 'Inter' }, padding: 16 } }, tooltip: { callbacks: { label: c => ` ${c.parsed} projetos` } } } }
        });
    }, 100);
}

// ─── INICIATIVA ───
function renderIniciativa(id) {
    const ini = appData.iniciativas.find(i => i.id === id);
    if (!ini) return;
    setHeader(`${ini.icon} ${ini.title}`, ini.subtitle);
    document.getElementById('header-badges').innerHTML = '';

    const projHtml = ini.projetos.map((p, idx) => {
        const accId = `acc-${id}-${idx}`;
        let body = '';

        // Objetivo
        body += `<div class="mb-5"><p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Objetivo Estratégico</p>
            <p class="text-sm text-slate-600 leading-relaxed bg-white border border-slate-200 rounded-lg p-4 italic">${p.objetivo}</p></div>`;

        // Detalhamento
        if (p.detalhamento) {
            const html = p.detalhamento
                .split('\n\n')
                .map(block => {
                    if (block.trim().startsWith('•')) {
                        const items = block.split('\n').filter(l => l.trim());
                        return `<ul class="space-y-1 mt-1 mb-1">${items.map(i => `<li class="flex gap-2"><span class="text-slate-400 shrink-0">•</span><span>${i.replace(/^•\s*/, '')}</span></li>`).join('')}</ul>`;
                    }
                    return `<p class="mb-2">${block.trim()}</p>`;
                }).join('');
            body += `<div class="mb-5"><p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Detalhamento</p><div class="text-sm text-slate-600 leading-relaxed">${html}</div></div>`;
        }

        // Link extra (Café, Gestão)
        // Frentes (IA+IH, Pesquisa, etc.)
        if (p.frentes) {
            body += `<div class="mb-5"><p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Status por Frente</p><div class="space-y-3">`;
            p.frentes.forEach(f => {
                const isAtencao = f.tipo === 'atencao';
                body += `
                    <div class="p-4 rounded-lg border ${isAtencao ? 'bg-amber-50 border-amber-200' : 'bg-white border-slate-200'}">
                        <p class="text-xs font-bold mb-3 ${isAtencao ? 'text-amber-700' : 'text-slate-700'}">${f.nome}</p>
                        <div class="text-sm text-slate-600 leading-relaxed">${f.texto}</div>
                    </div>`;
            });
            body += `</div></div>`;
        }

        // Link extra (Café, Gestão)
        if (p.linkExtra) {
            body += `<div class="mb-5">
                <a href="${p.linkExtra.url}" target="_blank" rel="noopener noreferrer"
                   class="inline-flex items-center gap-2 bg-white border border-slate-200 hover:border-sky-300 hover:bg-sky-50 rounded-lg px-4 py-3 text-xs text-slate-600 hover:text-sky-600 transition-colors">
                   <span class="text-base">📄</span><span>${p.linkExtra.label}</span><span class="text-slate-300">↗</span>
                </a></div>`;
        }

        // Evidência extra (BID)
        if (p.evidenciaExtra) {
            const isObj = typeof p.evidenciaExtra === 'object';
            body += `<div class="mb-5 p-4 bg-slate-50 border border-slate-200 rounded-lg">
                <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Evidência</p>
                ${isObj
                    ? `<a href="${p.evidenciaExtra.url}" target="_blank" rel="noopener noreferrer"
                         class="flex items-start gap-3 hover:text-sky-600 transition-colors group">
                         <span class="text-slate-400 group-hover:text-sky-400 shrink-0 mt-0.5 text-base">📄</span>
                         <span class="text-sm text-slate-600 group-hover:text-sky-600 leading-relaxed">${p.evidenciaExtra.label}</span>
                         <span class="text-slate-300 group-hover:text-sky-400 shrink-0 mt-0.5">↗</span>
                       </a>`
                    : `<p class="text-sm text-slate-600 leading-relaxed">${p.evidenciaExtra}</p>`
                }</div>`;
        }

        // Evidências (BID links)
        if (p.evidencias) {
            body += `<div class="mb-5"><p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Evidências de Utilização</p><div class="grid grid-cols-2 gap-2">`;
            p.evidencias.forEach(e => {
                body += `<a href="${e.url}" target="_blank" rel="noopener noreferrer"
                   class="flex items-center gap-2 bg-white border border-slate-200 hover:border-sky-300 hover:bg-sky-50 rounded-lg p-3 text-xs text-slate-600 hover:text-sky-600 transition-colors group">
                    <span class="text-slate-300 group-hover:text-sky-400 text-base shrink-0">📁</span>
                    <span class="flex-1">${e.label}</span>
                    <span class="text-slate-300 group-hover:text-sky-400 shrink-0">↗</span></a>`;
            });
            body += `</div></div>`;
        }

        // Resultados das pesquisas (Café com Diretor)
        if (p.resultados) {
            body += `<div class="mb-5"><p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Resultados das Pesquisas de Satisfação</p><div class="space-y-4">`;
            p.resultados.forEach(r => {
                body += `
                <div class="bg-white border border-slate-200 rounded-xl overflow-hidden">
                    <div class="px-5 py-3 border-b border-slate-100 flex items-center justify-between" style="background:#f0fdff;">
                        <span class="text-sm font-bold text-slate-700">${r.titulo}</span>
                        <span class="text-xs font-semibold px-2.5 py-1 rounded-full" style="background:#00c9eb22;color:#00899e;">👥 ${r.participantes} participantes</span>
                    </div>
                    <div class="p-5 grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <p class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">📊 Resultado Geral</p>
                            <ul class="space-y-1.5">${r.geral.map(g => `<li class="text-xs text-slate-600 leading-relaxed flex gap-2"><span class="text-sky-400 shrink-0 mt-0.5">●</span>${g}</li>`).join('')}</ul>
                        </div>
                        <div>
                            <p class="text-xs font-bold text-emerald-600 uppercase tracking-wider mb-2">✅ Pontos Positivos</p>
                            <ul class="space-y-1.5">${r.positivos.map(p => `<li class="text-xs text-slate-600 leading-relaxed flex gap-2"><span class="text-emerald-400 shrink-0 mt-0.5">+</span>${p}</li>`).join('')}</ul>
                        </div>
                        <div>
                            <p class="text-xs font-bold text-amber-600 uppercase tracking-wider mb-2">💡 Oportunidades de Melhoria</p>
                            <ul class="space-y-1.5">${r.melhorias.map(m => `<li class="text-xs text-slate-600 leading-relaxed flex gap-2"><span class="text-amber-400 shrink-0 mt-0.5">→</span>${m}</li>`).join('')}</ul>
                        </div>
                    </div>
                </div>`;
            });
            body += `</div></div>`;
        }
        if (p.calendario) {
            body += `<div class="mb-5"><p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Calendário de Eventos 2026</p>
            <table class="w-full text-sm border-collapse">
                <thead><tr class="bg-slate-50">
                    <th class="text-left py-2 px-3 text-xs font-semibold text-slate-400 border-b border-slate-200">Data</th>
                    <th class="text-left py-2 px-3 text-xs font-semibold text-slate-400 border-b border-slate-200">Status</th>
                    <th class="text-left py-2 px-3 text-xs font-semibold text-slate-400 border-b border-slate-200">Local</th>
                </tr></thead><tbody>`;
            p.calendario.forEach(ev => {
                const isReal = ev.status === 'Realizado';
                const isConf = ev.status === 'Confirmado';
                const cls = isReal ? 'text-emerald-600' : isConf ? 'text-sky-600' : 'text-amber-600';
                const icon = isReal ? '✔' : isConf ? '✔' : '◷';
                body += `<tr class="border-b border-slate-100">
                    <td class="py-2 px-3 text-slate-600">${ev.data}</td>
                    <td class="py-2 px-3 font-semibold ${cls}">${icon} ${ev.status}</td>
                    <td class="py-2 px-3 text-slate-600">${ev.local}</td></tr>`;
            });
            body += `</tbody></table></div>`;
        }

        // TAC BH visual (tabela + gráfico)
        if (p.tacbhData) {
            const d = p.tacbhData;
            const chartId = `tacbh-chart-${idx}`;
            const motifColors = { 'Projeto em Crise': '#ef4444', 'Demanda Emergencial': '#f59e0b', 'Situação Pontual': '#0ea5e9' };

            body += `
            <div class="mb-5 space-y-4">

                <!-- KPI total -->
                <div class="flex items-center gap-4 p-4 rounded-xl border border-slate-200 bg-white">
                    <div class="text-center px-5 py-3 rounded-lg" style="background:#f0fdff;">
                        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Total de HE</p>
                        <p class="text-3xl font-extrabold" style="color:#00899e;">${d.totalHoras}</p>
                        <p class="text-xs text-slate-400 mt-1">período ${d.periodo}</p>
                    </div>
                    <div class="flex-1 grid grid-cols-3 gap-3">
                        ${d.classificacao.map(c => `
                        <div class="text-center p-3 rounded-lg bg-slate-50 border border-slate-100">
                            <p class="text-xl font-extrabold" style="color:${motifColors[c.label] || '#64748b'};">${c.percentual}%</p>
                            <p class="text-xs text-slate-500 mt-1 leading-tight">${c.label}</p>
                        </div>`).join('')}
                    </div>
                </div>

                <!-- Tabela top 3 -->
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Top 3 Clientes com Maior Volume de HE</p>
                    <table class="w-full border-collapse text-sm">
                        <thead>
                            <tr class="bg-slate-50">
                                <th class="text-left py-2.5 px-4 text-xs font-semibold text-slate-400 uppercase tracking-wide border-b border-slate-200">#</th>
                                <th class="text-left py-2.5 px-4 text-xs font-semibold text-slate-400 uppercase tracking-wide border-b border-slate-200">Cliente</th>
                                <th class="text-center py-2.5 px-4 text-xs font-semibold text-slate-400 uppercase tracking-wide border-b border-slate-200">Horas</th>
                                <th class="text-center py-2.5 px-4 text-xs font-semibold text-slate-400 uppercase tracking-wide border-b border-slate-200">%</th>
                                <th class="text-left py-2.5 px-4 text-xs font-semibold text-slate-400 uppercase tracking-wide border-b border-slate-200">Classificação</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${d.topClientes.map((c, i) => `
                            <tr class="${i % 2 === 0 ? 'bg-white' : 'bg-slate-50'} border-b border-slate-100">
                                <td class="py-3 px-4 font-bold text-slate-400">${i + 1}º</td>
                                <td class="py-3 px-4 font-semibold text-slate-800">${c.cliente}</td>
                                <td class="py-3 px-4 text-center font-bold text-slate-700">${c.horas}</td>
                                <td class="py-3 px-4 text-center">
                                    <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold" style="background:${motifColors[c.motivo]}22;color:${motifColors[c.motivo]};">${c.percentual}%</span>
                                </td>
                                <td class="py-3 px-4">
                                    <span class="inline-flex items-center gap-1.5 text-xs font-semibold" style="color:${motifColors[c.motivo]};">● ${c.motivo}</span>
                                </td>
                            </tr>`).join('')}
                        </tbody>
                    </table>
                </div>

                <!-- Gráfico -->
                <div class="bg-white border border-slate-200 rounded-xl p-5">
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4">Classificação de Causa — Distribuição %</p>
                    <canvas id="${chartId}" height="90"></canvas>
                </div>

                <!-- Link completo -->
                ${d.linkCompleto ? `<a href="${d.linkCompleto.url}" target="_blank" rel="noopener noreferrer"
                   class="flex items-center gap-3 bg-white border border-slate-200 hover:border-sky-300 hover:bg-sky-50 rounded-xl px-5 py-4 text-sm text-slate-600 hover:text-sky-600 transition-colors group">
                    <span class="text-xl shrink-0">📊</span>
                    <span class="flex-1 font-medium">Ver levantamento completo — todos os clientes, motivos e justificativas</span>
                    <span class="text-slate-300 group-hover:text-sky-400 shrink-0 font-bold">↗</span>
                </a>` : ''}
            </div>`;

            // Init chart after render
            const _chartId = chartId;
            const _labels = d.classificacao.map(c => c.label);
            const _data   = d.classificacao.map(c => c.percentual);
            const _colors = d.classificacao.map(c => motifColors[c.label] || '#64748b');
            setTimeout(() => {
                const ctx = document.getElementById(_chartId);
                if (!ctx || ctx._chartInstance) return;
                ctx._chartInstance = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: _labels,
                        datasets: [{ data: _data, backgroundColor: _colors, borderRadius: 6, borderSkipped: false }]
                    },
                    options: {
                        responsive: true,
                        plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ' ' + c.parsed.y + '%' } } },
                        scales: {
                            y: { beginAtZero: true, max: 100, ticks: { callback: v => v + '%', font: { size: 11 } }, grid: { color: '#f1f5f9' } },
                            x: { ticks: { font: { size: 11 } }, grid: { display: false } }
                        }
                    }
                });
            }, 200);
        }
        if (p.atencao) {
            body += `<div class="mb-5 p-4 bg-amber-50 border border-amber-200 rounded-lg">
                <p class="text-xs font-bold text-amber-700 mb-1">⚠️ Ponto de Atenção</p>
                <p class="text-sm text-amber-800 leading-relaxed">${p.atencao}</p></div>`;
        }

        // Próximos Passos
        if (p.proximosPassos) {
            const items = p.proximosPassos.split('\n\n').filter(l => l.trim());
            const html = items.map(i => `<div class="flex items-start gap-3"><span class="text-indigo-400 shrink-0 mt-0.5 font-bold">→</span><p class="text-sm text-indigo-800 leading-relaxed">${i.trim()}</p></div>`).join('');
            body += `<div><p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Próximos Passos</p>
                <div class="bg-indigo-50 border border-indigo-100 rounded-lg p-4 space-y-2">${html}</div></div>`;
        }

        // Placeholder
        if (!p.detalhamento && !p.frentes && !p.calendario) {
            body += `<div class="mt-2 p-4 bg-slate-50 border border-dashed border-slate-200 rounded-lg text-center">
                <p class="text-xs text-slate-400 italic">Detalhamento em atualização — aguarde a próxima edição.</p></div>`;
        }

        const isEncerrado = p.status === 'encerrado';
        return `<div class="bg-white border ${isEncerrado ? 'border-red-100' : 'border-slate-200'} rounded-xl shadow-sm overflow-hidden">
            <button class="w-full px-6 py-5 flex items-center justify-between hover:bg-slate-50 transition-colors focus:outline-none" onclick="toggleAcc('${accId}')">
                <div class="text-left pr-4">
                    <h3 class="font-bold text-slate-800 text-base md:text-lg leading-snug">${p.titulo}</h3>
                    <div class="flex items-center gap-3 mt-2 flex-wrap">
                        ${statusPill(p.status)}
                        <span class="text-xs text-slate-400">👤 ${p.responsavel}</span>
                    </div>
                </div>
                <span id="icon-${accId}" class="chevron flex items-center justify-center w-8 h-8 rounded-full bg-slate-100 text-slate-400 shrink-0 text-xs">▼</span>
            </button>
            <div id="${accId}" class="accordion-content border-t border-slate-100 bg-slate-50/30">
                <div class="p-6 md:p-8">${body}</div>
            </div>
        </div>`;
    }).join('');

    document.getElementById('content-container').innerHTML = `
    <div class="max-w-4xl mx-auto space-y-5 pb-16">
        <div class="bg-white p-5 md:p-6 rounded-xl shadow-sm border border-slate-200">
            <p class="text-slate-600 text-sm md:text-base leading-relaxed">${ini.descricao} <strong>Clique nos itens abaixo para expandir o detalhamento.</strong></p>
        </div>
        ${projHtml}
    </div>`;
}

// ─── UTILS ───
function setHeader(title, sub) {
    document.getElementById('main-title').innerHTML = title;
    document.getElementById('main-subtitle').textContent = sub;
}
function toggleAcc(id) {
    const content = document.getElementById(id);
    const icon = document.getElementById('icon-' + id);
    const isOpen = content.classList.contains('open');
    document.querySelectorAll('.accordion-content.open').forEach(el => {
        if (el.id !== id) { el.classList.remove('open'); const i = document.getElementById('icon-' + el.id); if (i) { i.classList.remove('rotated'); i.style.transform = ''; } }
    });
    content.classList.toggle('open', !isOpen);
    icon.classList.toggle('rotated', !isOpen);
}
function navTo(id) {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    const ini = appData.iniciativas.find(i => i.id === id);
    if (!ini) return;
    const idx = appData.iniciativas.indexOf(ini);
    const items = [...document.querySelectorAll('.nav-item')];
    if (items[idx]) items[idx].classList.add('active');
    renderIniciativa(id);
}
document.addEventListener('DOMContentLoaded', () => { renderSidebar(); renderOverview(); });
</script>
