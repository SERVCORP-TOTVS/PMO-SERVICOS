<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>Protected Page</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            .staticrypt-hr {
                margin-top: 20px;
                margin-bottom: 20px;
                border: 0;
                border-top: 1px solid #eee;
            }

            .staticrypt-page {
                max-width: 460px;
                width: 92%;
                padding: 4% 0 0;
                margin: auto;
                box-sizing: border-box;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: #ffffff;
                max-width: 460px;
                margin: 0 auto 90px;
                padding: 44px 30px 36px;
                text-align: center;
                box-shadow: 0 24px 64px rgba(15, 23, 42, 0.12);
                border-radius: 30px;
            }

            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: #f4f7ff;
                border: 1px solid #dbe4f4;
                box-sizing: border-box;
                font-size: 14px;
                outline: 0;
                padding: 18px 48px 18px 18px;
                width: 100%;
                border-radius: 18px;
                color: #0f172a;
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: #f4f7ff;
                width: 100%;
                border-radius: 18px;
                margin: 0 0 18px;
                box-sizing: border-box;
                border: 1px solid #dbe4f4;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 0.75;
                padding: 13px;
                position: absolute;
                right: 14px;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                outline: 0;
                background: linear-gradient(180deg, #09a8f2, #047cc8);
                width: 100%;
                border: 0;
                padding: 16px;
                color: #ffffff;
                font-size: 15px;
                cursor: pointer;
                border-radius: 999px;
                font-weight: 700;
                letter-spacing: 0.04em;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                filter: brightness(94%);
            }

            .staticrypt-html {
                min-height: 100%;
            }

            .staticrypt-body {
                min-height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                min-height: 100%;
                margin-bottom: 1em;
                background: radial-gradient(circle at top, #f6fbff 0%, #edf4fb 45%, #f8fafc 100%);
                font-family: "Inter", "Arial", sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-instructions {
                margin-top: -1em;
                margin-bottom: 1em;
            }

            .staticrypt-title {
                font-size: 1.5em;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1em;
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.5);
                margin-right: 1em;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid gray;
                border-right-color: transparent;
                border-radius: 50%;
                -webkit-animation: spinner-border 0.75s linear infinite;
                animation: spinner-border 0.75s linear infinite;
                animation-duration: 0.75s;
                animation-timing-function: linear;
                animation-delay: 0s;
                animation-iteration-count: infinite;
                animation-direction: normal;
                animation-fill-mode: none;
                animation-play-state: running;
                animation-name: spinner-border;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                input[type="text"] {
                    font-size: 16px;
                }
            }

            @media (max-width: 767px) {
                .staticrypt-page { width: 96%; padding: 3% 0 0; }
                .staticrypt-form { padding: 34px 22px 24px; }
                .staticrypt-form input[type="password"], input[type="text"] {
                    padding: 14px 42px 14px 14px;
                }
                .staticrypt-form .staticrypt-decrypt-button {
                    padding: 14px;
                    font-size: 14px;
                }
                .staticrypt-title { font-size: 1.35rem; }
                .staticrypt-page img { height: 48px; }
            }
        </style>
    </head>
