// ─── HELPERS ───
function statusPill(s) {
    if (s === 'andamento')  return `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-sky-100 text-sky-600">● Em andamento</span>`;
    if (s === 'encerrado')  return `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-600">● Concluído</span>`;
    return `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-100 text-amber-600">● À iniciar</span>`;
}

function countProjects() {
    let total = 0, andamento = 0, iniciar = 0, encerrado = 0;
    appData.iniciativas.forEach(i => {
        if (i.tipo === 'iniciativa') {
            i.projetos.forEach(p => {
                total++;
                if (p.status === 'andamento') andamento++;
                else if (p.status === 'encerrado') encerrado++;
                else iniciar++;
            });
        }
    });
    return { total, andamento, iniciar, encerrado };
}

function countByResp() {
    const map = {};
    appData.iniciativas.forEach(i => {
        if (i.tipo !== 'iniciativa') return;
        i.projetos.forEach(p => {
            if (p.status === 'encerrado') return;
            p.responsavel.split('·').forEach(r => {
                const name = r.trim();
                if (name === 'A definir') return;
                map[name] = (map[name] || 0) + 1;
            });
        });
    });
    return Object.entries(map).sort((a, b) => b[1] - a[1]);
}

// ─── SIDEBAR ───
function renderSidebar() {
    const nav = document.getElementById('sidebar-nav');
    nav.innerHTML = '';
    appData.iniciativas.forEach(ini => {
        const count = ini.tipo === 'iniciativa' ? ini.projetos.length : null;
        const el = document.createElement('div');
        el.className = 'nav-item px-4 py-2.5 rounded flex items-center gap-3 text-sm font-medium text-slate-600 shrink-0';
        el.innerHTML = `
            <span class="text-base">${ini.icon}</span>
            <span class="flex-1 leading-tight">${ini.shortTitle}</span>
            ${count ? `<span class="text-xs bg-slate-100 text-slate-400 font-semibold px-1.5 py-0.5 rounded-full">${count}</span>` : ''}
        `;
        if (ini.id === 'overview') el.classList.add('active');
        el.addEventListener('click', () => {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            ini.tipo === 'overview' ? renderOverview() : renderIniciativa(ini.id);
        });
        nav.appendChild(el);
    });
}

            <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5 flex flex-col gap-1">
                <span class="text-xs text-slate-400 font-semibold uppercase tracking-wide">Total de Projetos</span>
                <span class="text-4xl font-extrabold text-slate-800">${counts.total}</span>
                <span class="text-xs text-slate-400">em 14 iniciativas</span>
            </div>
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5 flex flex-col gap-1">
                <span class="text-xs text-slate-400 font-semibold uppercase tracking-wide">Em Andamento</span>
                <span class="text-4xl font-extrabold text-sky-500">${counts.andamento}</span>
                <span class="text-xs text-slate-400">${Math.round(counts.andamento/counts.total*100)}% do portfólio</span>
            </div>
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5 flex flex-col gap-1">
                <span class="text-xs text-slate-400 font-semibold uppercase tracking-wide">À Iniciar</span>
                <span class="text-4xl font-extrabold text-amber-400">${counts.iniciar}</span>
                <span class="text-xs text-slate-400">${Math.round(counts.iniciar/counts.total*100)}% do portfólio</span>
            </div>
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5 flex flex-col gap-1">
                <span class="text-xs text-slate-400 font-semibold uppercase tracking-wide">Concluídos</span>
                <span class="text-4xl font-extrabold text-emerald-500">${counts.encerrado}</span>
                <span class="text-xs text-slate-400">${Math.round(counts.encerrado/counts.total*100)}% do portfólio</span>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
                <h3 class="font-bold text-slate-700 text-sm uppercase tracking-wider mb-5">Projetos por Responsável</h3>
                <div class="space-y-3">${respBars}</div>
            </div>
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6 flex flex-col items-center justify-center">
                <h3 class="font-bold text-slate-700 text-sm uppercase tracking-wider mb-4 self-start">Distribuição por Status</h3>
                <div class="chart-container"><canvas id="donutChart"></canvas></div>
            </div>
        </div>

        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-100">
                <h3 class="font-bold text-slate-700 text-sm uppercase tracking-wider">Todas as Iniciativas</h3>
            </div>
            <table class="w-full">
                <thead class="bg-slate-50">
                    <tr>
                        <th class="py-3 px-4 text-left text-xs font-semibold text-slate-400 uppercase tracking-wide">Iniciativa</th>
                        <th class="py-3 px-4 text-center text-xs font-semibold text-slate-400 uppercase tracking-wide">Projetos</th>
                        <th class="py-3 px-4 text-left text-xs font-semibold text-slate-400 uppercase tracking-wide hidden md:table-cell">Responsável(eis)</th>
                        <th class="py-3 px-4 text-left text-xs font-semibold text-slate-400 uppercase tracking-wide">Status</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">${tableRows}</tbody>
            </table>
        </div>
    </div>`;

    setTimeout(() => {
        const ctx = document.getElementById('donutChart');
        if (!ctx) return;
        new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ["Em andamento", "À iniciar", "Concluídos"],
                datasets: [{ data: [counts.andamento, counts.iniciar, counts.encerrado], backgroundColor: ['#0ea5e9', '#f59e0b', '#10b981'], borderWidth: 0, hoverOffset: 6 }]
            },
            options: { cutout: '72%', plugins: { legend: { position: 'bottom', labels: { font: { size: 11, family: 'Inter' }, padding: 16 } }, tooltip: { callbacks: { label: c => ` ${c.parsed} projetos` } } } }
        });
    }, 100);
}

// ─── INICIATIVA ───
function renderIniciativa(id) {
    const ini = appData.iniciativas.find(i => i.id === id);
    if (!ini) return;
    setHeader(`${ini.icon} ${ini.title}`, ini.subtitle);
    document.getElementById('header-badges').innerHTML = '';

    const projHtml = ini.projetos.map((p, idx) => {
        const accId = `acc-${id}-${idx}`;
        let body = '';

        // Objetivo
        body += `<div class="mb-5"><p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Objetivo Estratégico</p>
            <p class="text-sm text-slate-600 leading-relaxed bg-white border border-slate-200 rounded-lg p-4 italic">${p.objetivo}</p></div>`;

        // Detalhamento
        if (p.detalhamento) {
            const lines = p.detalhamento.split('\n\n').map(l => `<p class="text-sm text-slate-600 leading-relaxed mb-2">${l}</p>`).join('');
            body += `<div class="mb-5"><p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Detalhamento</p>${lines}</div>`;
        }

        // Link extra (Café, Gestão)
        // Frentes (IA+IH, Pesquisa, etc.)
        if (p.frentes) {
            body += `<div class="mb-5"><p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Status por Frente</p><div class="space-y-3">`;
            p.frentes.forEach(f => {
                const isAtencao = f.tipo === 'atencao';
                body += `
                    <div class="p-4 rounded-lg border ${isAtencao ? 'bg-amber-50 border-amber-200' : 'bg-white border-slate-200'}">
                        <p class="text-xs font-bold mb-3 ${isAtencao ? 'text-amber-700' : 'text-slate-700'}">${f.nome}</p>
                        <div class="text-sm text-slate-600 leading-relaxed">${f.texto}</div>
                    </div>`;
            });
            body += `</div></div>`;
        }

        // Link extra (Café, Gestão)
        if (p.linkExtra) {
            body += `<div class="mb-5">
                <a href="${p.linkExtra.url}" target="_blank" rel="noopener noreferrer"
                   class="inline-flex items-center gap-2 bg-white border border-slate-200 hover:border-sky-300 hover:bg-sky-50 rounded-lg px-4 py-3 text-xs text-slate-600 hover:text-sky-600 transition-colors">
                   <span class="text-base">📄</span><span>${p.linkExtra.label}</span><span class="text-slate-300">↗</span>
                </a></div>`;
        }

        // Evidência extra (BID)
        if (p.evidenciaExtra) {
            const isObj = typeof p.evidenciaExtra === 'object';
            body += `<div class="mb-5 p-4 bg-slate-50 border border-slate-200 rounded-lg">
                <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Evidência</p>
                ${isObj
                    ? `<a href="${p.evidenciaExtra.url}" target="_blank" rel="noopener noreferrer"

                         <span class="text-slate-400 group-hover:text-sky-400 shrink-0 mt-0.5 text-base">📄</span>
                         <span class="text-sm text-slate-600 group-hover:text-sky-600 leading-relaxed">${p.evidenciaExtra.label}</span>
                         <span class="text-slate-300 group-hover:text-sky-400 shrink-0 mt-0.5">↗</span>
                       </a>`
                    : `<p class="text-sm text-slate-600 leading-relaxed">${p.evidenciaExtra}</p>`
                }</div>`;
        }

        // Evidências (BID links)
        if (p.evidencias) {
            body += `<div class="mb-5"><p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Evidências de Utilização</p><div class="grid grid-cols-2 gap-2">`;
            p.evidencias.forEach(e => {
                body += `<a href="${e.url}" target="_blank" rel="noopener noreferrer"

                    <span class="text-slate-300 group-hover:text-sky-400 text-base shrink-0">📁</span>

                            <ul class="space-y-1.5">${r.positivos.map(p => `<li class="text-xs text-slate-600 leading-relaxed flex gap-2"><span class="text-emerald-400 shrink-0 mt-0.5">+</span>${p}</li>`).join('')}</ul>

                    <th class="text-left py-2 px-3 text-xs font-semibold text-slate-400 border-b border-slate-200">Data</th>
                    <th class="text-left py-2 px-3 text-xs font-semibold text-slate-400 border-b border-slate-200">Status</th>
                    <th class="text-left py-2 px-3 text-xs font-semibold text-slate-400 border-b border-slate-200">Local</th>

                const icon = isReal ? '✔' : isConf ? '✔' : '◷';

        }

        // TAC BH visual (tabela + gráfico)

                    </div>
                    <div class="flex-1 grid grid-cols-3 gap-3">
                        ${d.classificacao.map(c => `
                        <div class="text-center p-3 rounded-lg bg-slate-50 border border-slate-100">
                            <p class="text-xl font-extrabold" style="color:${motifColors[c.label] || '#64748b'};">${c.percentual}%</p>

                </div>

                <!-- Tabela top 3 -->
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Top 3 Clientes com Maior Volume de HE</p>
                    <table class="w-full border-collapse text-sm">
                        <thead>
                            <tr class="bg-slate-50">

                                <th class="text-center py-2.5 px-4 text-xs font-semibold text-slate-400 uppercase tracking-wide border-b border-slate-200">Horas</th>
                                <th class="text-center py-2.5 px-4 text-xs font-semibold text-slate-400 uppercase tracking-wide border-b border-slate-200">%</th>
                                <th class="text-left py-2.5 px-4 text-xs font-semibold text-slate-400 uppercase tracking-wide border-b border-slate-200">Classificação</th>
                            </tr>
                        </thead>
                        <tbody>

                            <tr class="${i % 2 === 0 ? 'bg-white' : 'bg-slate-50'} border-b border-slate-100">

                                </td>

                                </td>
                            </tr>`).join('')}
                        </tbody>
                    </table>
                </div>

                <!-- Gráfico -->
                <div class="bg-white border border-slate-200 rounded-xl p-5">
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4">Classificação de Causa — Distribuição %</p>
                    <canvas id="${chartId}" height="90"></canvas>
                </div>

                <!-- Link completo -->
                ${d.linkCompleto ? `<a href="${d.linkCompleto.url}" target="_blank" rel="noopener noreferrer"

        // Placeholder
        if (!p.detalhamento && !p.frentes && !p.calendario) {
            body += `<div class="mt-2 p-4 bg-slate-50 border border-dashed border-slate-200 rounded-lg text-center">
                <p class="text-xs text-slate-400 italic">Detalhamento em atualização — aguarde a próxima edição.</p></div>`;

        return `<div class="bg-white border ${isEncerrado ? 'border-red-100' : 'border-slate-200'} rounded-xl shadow-sm overflow-hidden">

                    <div class="flex items-center gap-3 mt-2 flex-wrap">

    }).join('');

    document.getElementById('content-container').innerHTML = `
    <div class="max-w-4xl mx-auto space-y-5 pb-16">
        <div class="bg-white p-5 md:p-6 rounded-xl shadow-sm border border-slate-200">
            <p class="text-slate-600 text-sm md:text-base leading-relaxed">${ini.descricao} <strong>Clique nos itens abaixo para expandir o detalhamento.</strong></p>
        </div>
        ${projHtml}
    </div>`;
}

// ─── UTILS ───
function setHeader(title, sub) {
    document.getElementById('main-title').innerHTML = title;
    document.getElementById('main-subtitle').textContent = sub;
}
function toggleAcc(id) {
    const content = document.getElementById(id);
    const icon = document.getElementById('icon-' + id);
    const isOpen = content.classList.contains('open');
    document.querySelectorAll('.accordion-content.open').forEach(el => {
        if (el.id !== id) { el.classList.remove('open'); const i = document.getElementById('icon-' + el.id); if (i) { i.classList.remove('rotated'); i.style.transform = ''; } }
    });
    content.classList.toggle('open', !isOpen);
    icon.classList.toggle('rotated', !isOpen);
}
function navTo(id) {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    const ini = appData.iniciativas.find(i => i.id === id);
    if (!ini) return;
    const idx = appData.iniciativas.indexOf(ini);
    const items = [...document.querySelectorAll('.nav-item')];
    if (items[idx]) items[idx].classList.add('active');
    renderIniciativa(id);
}
document.addEventListener('DOMContentLoaded', () => { renderSidebar(); renderOverview(); });
